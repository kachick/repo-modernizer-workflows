# https://taskfile.dev

version: '3'

tasks:
  default:
    deps:
      - task: compile

  compile:
    desc: Compile agentic workflows into GitHub Actions lock files
    cmds:
      - gh-aw compile

  check:
    desc: Check and validate workflows without emitting lock files
    cmds:
      - gh-aw compile --strict --no-emit

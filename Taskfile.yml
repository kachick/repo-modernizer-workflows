# https://taskfile.dev

version: '3'

tasks:
  default:
    deps:
      - task: compile
      - task: lint

  compile:
    desc: Compile agentic workflows into GitHub Actions lock files
    cmds:
      - gh-aw compile

  check:
    desc: Check and validate workflows without emitting lock files
    cmds:
      - gh-aw compile --strict --no-emit

  fmt:
    desc: Format files
    cmds:
      - dprint fmt

  lint:
    desc: Lint files
    cmds:
      - dprint check
      - typos . .github
      - zizmor .
      - task: check
